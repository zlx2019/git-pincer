# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Drives two things:
#   - .github/workflows/release.yml builds the GitHub Release notes from it
#   - contributors regenerate / preview CHANGELOG.md with it:
#       git cliff --unreleased --strip header      # what the next release will contain
#       git cliff --latest --strip header          # notes of the latest release
#
# Links are built from `remote.github.*`, so git-cliff queries the GitHub API: it needs
# network access, and a GITHUB_TOKEN to stay clear of the anonymous rate limit
# (release.yml provides one). The repository is taken from the `origin` remote, or from
# GITHUB_REPO=owner/repo.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file. See [conventional commits](https://www.conventionalcommits.org/) for commit guidelines.\n
"""
# https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
---
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message|trim }} - ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})) - {{ commit.author.name }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}\
                {{ commit.message|trim }} - ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})) - {{ commit.author.name }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace from the templates
trim = true
postprocessors = []

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# keep commits that are not conventional (they fall into "Other" below)
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
commit_preprocessors = [
    # `git revert` writes a boilerplate body ("This reverts commit <sha>.") that is
    # not a conventional commit, so it would leak into the notes as a stray paragraph.
    # Keep the subject only — and only for reverts: stripping every body would also
    # drop `BREAKING CHANGE:` footers, which git-cliff reads to flag breaking changes.
    { pattern = '(?s)^(Revert "[^\n]*")\n.*', replace = "${1}" },
]
# Rules are tried top to bottom and the first match wins, so order matters:
# skip rules, then the commit types, then the catch-all.
#
# The `<!-- NN -->` prefix fixes the section order (groups sort by their raw value;
# the body template strips it with `striptags` before rendering).
commit_parsers = [
    # --- left out of the notes ---------------------------------------------------
    { message = "\\[skip", skip = true },
    # release notes are in English; commits written in Chinese are internal notes
    { message = "\\p{Han}", skip = true },
    # Merge commits duplicate the PR's commits (and drag the whole PR body into the
    # notes); the real changes are already listed by their groups.
    # Covers "Merge pull request", "Merge branch" and "Merge remote-tracking branch"
    { message = "^Merge (pull request|(remote-tracking )?branch)", skip = true },
    # release bookkeeping: version bumps and changelog-only commits
    { message = "^chore\\(version\\):", skip = true },
    { message = "^docs?(\\([^)]*\\))?: .*changelog", skip = true },
    # --- grouped -----------------------------------------------------------------
    { message = "^feat", group = "<!-- 00 -->🚀 Features" },
    { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 03 -->🚜 Refactoring" },
    { message = "^doc", group = "<!-- 04 -->📚 Documentation" },
    { message = "^style", group = "<!-- 05 -->🎨 Style" },
    { message = "^test", group = "<!-- 06 -->🧪 Tests" },
    { message = "^build", group = "<!-- 07 -->📦 Build System" },
    { message = "^ci", group = "<!-- 08 -->🤖 Continuous Integration" },
    { message = "^chore", group = "<!-- 09 -->⚙️ Miscellaneous Chores" },
    # `git revert` titles its commits `Revert "..."`
    { message = "^[Rr]evert", group = "<!-- 10 -->◀️ Revert" },
    { message = ".*", group = "<!-- 11 -->💼 Other" },
]
# a breaking change is never hidden by a skip rule above
protect_breaking_commits = true
# keep commits that no rule matched (the catch-all above groups them)
filter_commits = false
# Only stable tags (vX.Y.Z) are version nodes. Pre-release tags (v0.1.0-rc.1, ...)
# don't split the history, so the stable release's notes include everything that
# landed during its release candidates.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = ""
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections: oldest first
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
