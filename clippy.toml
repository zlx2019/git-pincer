# Clippy configuration.
#
# Pairs with [lints.clippy] in Cargo.toml: production code must not use
# unwrap / expect / panic / dbg, while tests may use them freely.
# Note: these switches only cover `#[test]` function bodies and `#[cfg(test)]`
# modules. Helper functions in integration tests (tests/*.rs) need a crate-level
# `#![allow(...)]` instead.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-panic-in-tests = true
