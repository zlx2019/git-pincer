name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to a branch cancels the run still in progress for it, saving CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # formatting and clippy
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # unit and integration tests (nextest) on the three platform families the Release ships:
  # the Windows/macOS-specific paths (clipboard, editor fallback, config path, CRLF)
  # are exercised for real instead of only being cross-compiled
  test:
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest
        run: cargo nextest run --all-features --no-tests pass

  # security advisories and license audit of the dependencies
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # spell check
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned so upstream changes can't break CI unexpectedly (dependabot bumps it periodically)
      - uses: crate-ci/typos@v1.48.0
