name: Release
# On a pushed `v*` tag:
#   - generate the release notes with git-cliff
#   - create the GitHub Release and attach the per-platform binaries
#   - publish to crates.io (stable tags only)
#   - publish to npm: the main package plus one binary package per platform (stable tags only),
#     through npm trusted publishing (OIDC); no npm token is stored
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ contains(github.ref_name, '-') && format('--unreleased --tag {0}', github.ref_name) || '--latest' }} --strip header
        # cliff.toml builds its links from `remote.github.*`, so git-cliff queries the
        # GitHub API: name the repository and authenticate to avoid the anonymous rate limit.
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          token: ${{ secrets.GITHUB_TOKEN }}
          # SemVer pre-release tags (contain "-", e.g. v0.1.0-rc.1) are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}

  build:
    name: Build ${{ matrix.target }}
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      # Linux cross target (aarch64 / musl) requires the corresponding linker and C toolchain.
      - name: Setup cross toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Resolve binary name
        id: meta
        shell: bash
        run: echo "bin=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')" >> "$GITHUB_OUTPUT"
      # Compile and package (Unix → tar.gz, Windows → zip) and attach to Release.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ steps.meta.outputs.bin }}
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: README.md,LICENSE
          leading-dir: true
          # ship a sha256 checksum file next to every artifact so downloads can be verified
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # abort when the tag and the Cargo.toml version disagree, so a mismatched version is never published
      - name: Verify tag matches package version
        run: |
          pkg=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$pkg" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match the Cargo.toml version $pkg"
            exit 1
          fi
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Trusted publishing: each of the 7 npm packages has a trusted publisher configured on
    # npmjs.com that names this repository and THIS FILE (release.yml). Renaming the file
    # or moving the publish step to another workflow breaks publishing until it is updated.
    # A job-level `permissions` replaces the workflow-level one, so contents is listed again.
    permissions:
      id-token: write # lets npm exchange the job's OIDC token for a short-lived publish token
      contents: read # checkout and `gh release download`
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # trusted publishing needs npm 11.5.1+, while Node 22 ships npm 10
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Download release assets
        run: gh release download "$TAG" --pattern "*.tar.gz" --pattern "*.zip" --dir /tmp/assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # assemble 6 per-platform packages and 1 main package from the release archives
      - name: Assemble npm packages
        run: node npm/build.mjs "$TAG" /tmp/assets
      # publish the platform packages first and the main package last, so there is never a
      # window where the main package is installable but its platform package is missing
      - name: Publish packages
        run: |
          for pkg in npm/dist/@zero9501/*; do
            npm publish "$pkg" --access public
          done
          npm publish npm/dist/git-pincer --access public
